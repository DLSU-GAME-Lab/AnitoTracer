<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AnitoTracer</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0b1020;
      --card: #151b2f;
      --text: #e8ecf3;
      --muted: #b7c0d1;
      --accent: #7cc4ff;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #0b1020, #1c2747);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
    }

    main {
      max-width: 760px;
      margin: 2rem;
      padding: 2rem;
      background: rgba(21, 27, 47, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
    }

    h1 {
      margin-top: 0;
      font-size: 2.5rem;
      line-height: 1.1;
    }

    p {
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.7;
    }

    .tag {
      display: inline-block;
      margin-bottom: 1rem;
      padding: 0.4rem 0.75rem;
      border-radius: 999px;
      background: rgba(124, 196, 255, 0.12);
      color: var(--accent);
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.03em;
    }

    a.button {
      display: inline-block;
      margin-top: 1rem;
      padding: 0.85rem 1.2rem;
      border-radius: 10px;
      background: var(--accent);
      color: #08101f;
      text-decoration: none;
      font-weight: 700;
    }

    a.button:hover {
      opacity: 0.92;
    }
  </style>
</head>
<body>
  <main>
    <div class="tag">DLSU-GAME-Lab</div>
    <h1>AnitoTracer</h1>
    <p>Repository for the Anito Tracer.</p>
    <p>This is a simple GitHub Pages landing page for the project branch <strong>Cala_Physics_Scene</strong>.</p>
    <a class="button" href="https://github.com/DLSU-GAME-Lab/AnitoTracer/tree/feature/Cala_Physics_Scene">View Source on GitHub</a>
  </main>
</body>
</html>
